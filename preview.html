<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DomiRank · Preview</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root, :root[data-theme="dark"]{
  --bg:#0a1020; --bg-2:#0f1729; --surface:#131c30; --surface-2:#18233c;
  --surface-3:#1f2c49; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
  --text:#eef2ff; --text-dim:#a6b0c8; --text-mute:#6b7490;
  --primary:#10b981; --primary-2:#059669; --primary-soft:rgba(16,185,129,.15);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12);
  --warning:#f59e0b; --warning-soft:rgba(245,158,11,.12);
  --info:#3b82f6; --info-soft:rgba(59,130,246,.12);
  --teamA:#3b82f6; --teamB:#ef4444;
  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.6);
  --bg-grad-1:rgba(16,185,129,.10); --bg-grad-2:rgba(59,130,246,.08); --bg-grad-3:rgba(245,158,11,.05);
  --header-bg:rgba(15,23,41,.85);
}
:root[data-theme="light"]{
  --bg:#f3f4f8; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f1f5f9;
  --surface-3:#e2e8f0; --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.16);
  --text:#0f172a; --text-dim:#475569; --text-mute:#94a3b8;
  --primary:#059669; --primary-2:#047857; --primary-soft:rgba(5,150,105,.10);
  --danger:#dc2626; --danger-soft:rgba(220,38,38,.10);
  --warning:#d97706; --warning-soft:rgba(217,119,6,.10);
  --info:#2563eb; --info-soft:rgba(37,99,235,.10);
  --teamA:#2563eb; --teamB:#dc2626;
  --shadow-card:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --bg-grad-1:rgba(16,185,129,.05); --bg-grad-2:rgba(59,130,246,.05); --bg-grad-3:rgba(245,158,11,.03);
  --header-bg:rgba(255,255,255,.85);
}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(1200px 800px at 15% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, var(--bg-grad-2), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, var(--bg-grad-3), transparent 60%);
  background-attachment:fixed; min-height:100vh;
  transition: background-color .2s, color .2s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);background:var(--header-bg);backdrop-filter:blur(8px)}
.nav-inner{max-width:76rem;margin:0 auto;padding:0 1rem;height:3.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand-icon{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:.45rem;background:linear-gradient(135deg,#10b981,#059669);color:#0a1020;font-size:.85rem;font-weight:800}
nav{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}
.nav-link{padding:.45rem .7rem;border-radius:.4rem;color:var(--text-dim);font-size:.9rem;transition:all .15s}
.nav-link:hover{color:var(--text);background:var(--surface-2)}
.nav-link.active{color:var(--text);background:var(--surface-2)}

main{max-width:76rem;margin:0 auto;padding:2rem 1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.875rem;box-shadow:var(--shadow-card);padding:1.25rem}
.card-tight{padding:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem 1rem;border-radius:.5rem;font-weight:500;transition:all .15s;font-size:.95rem;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#000}
.btn-primary:hover{background:var(--primary-2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-sm{padding:.3rem .65rem;font-size:.82rem}
.label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:.25rem}
.input,select.input,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;color:var(--text);outline:none}
.input:focus{border-color:var(--primary)}
.badge{display:inline-flex;align-items:center;padding:.1rem .5rem;border-radius:.3rem;font-size:.75rem;font-weight:500}
.badge-win{background:rgba(16,185,129,.15);color:var(--primary)}
.badge-loss{background:rgba(239,68,68,.12);color:var(--danger)}
.badge-info{background:rgba(59,130,246,.15);color:var(--info)}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-muted{background:var(--surface-2);color:var(--text-mute)}

.hero{text-align:center;padding:2.5rem 0 1.5rem}
.hero h1{font-size:2.8rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.75rem;line-height:1.05}
.hero h1 .grad{background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text-dim);font-size:1.1rem;max-width:38rem;margin:0 auto}
.hero .cta{display:flex;gap:.75rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}

.tabs{display:inline-flex;gap:.15rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:.2rem}
.tab{padding:.35rem .9rem;border-radius:.35rem;font-size:.85rem;color:var(--text-dim);cursor:pointer}
.tab.active{background:var(--surface-3);color:var(--text)}
.tabs.full{display:flex;width:100%}
.tabs.full .tab{flex:1;text-align:center}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:.05em;padding:.7rem 1rem;border-bottom:1px solid var(--border);font-weight:600}
tbody td{padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.95rem;vertical-align:middle}
tbody tr:hover{background:rgba(24,35,60,.5)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Consolas,monospace}
.text-primary{color:var(--primary)} .text-danger{color:var(--danger)} .text-info{color:var(--info)}
.text-dim{color:var(--text-dim)} .text-mute{color:var(--text-mute)}
.text-right{text-align:right} .text-center{text-align:center}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:720px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}
.stack{display:flex;flex-direction:column;gap:1.25rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.col{display:flex;flex-direction:column;gap:.5rem}
.section-title{font-size:1.6rem;font-weight:700;margin-bottom:1rem;letter-spacing:-.01em}
.muted-help{color:var(--text-mute);font-size:.8rem;text-align:center}

.rating-big{font-size:2.5rem;font-weight:800;color:var(--primary);line-height:1}
.rating-row{display:flex;align-items:baseline;gap:.5rem;margin-top:.25rem}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:1rem;font-size:.9rem}
.kpi-label{font-size:.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em}

.team-card{padding:1rem;border-radius:.75rem;border:1px solid var(--border);background:var(--surface)}
.team-card.winner{border-color:rgba(16,185,129,.5);background:linear-gradient(180deg, rgba(16,185,129,.04), transparent)}
.team-A{color:var(--teamA)} .team-B{color:var(--teamB)}
.score-display{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

footer{max-width:76rem;margin:0 auto;padding:2.5rem 1rem;text-align:center;color:var(--text-mute);font-size:.85rem}

.banner{padding:.7rem 1rem;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:.5rem;color:var(--warning);font-size:.85rem;text-align:center;margin-bottom:1.5rem}
.banner.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.2);color:var(--info)}
.banner.error{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--danger)}

.delta-up{color:var(--primary)} .delta-down{color:var(--danger)}
.empty{padding:3rem 1rem;text-align:center;color:var(--text-mute)}
.link{color:var(--primary);cursor:pointer} .link:hover{text-decoration:underline}
.divider{height:1px;background:var(--border);margin:.75rem 0}

.player-row{padding:.6rem .75rem;background:var(--surface-2);border-radius:.5rem;display:flex;align-items:center;gap:.6rem}
.player-row + .player-row{margin-top:.4rem}

/* ===== Avatar ===== */
.avatar{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;font-weight:600;color:#fff;line-height:1;user-select:none;background:var(--surface-3)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-link{display:inline-flex;align-items:center;gap:.6rem}
.avatar-link:hover .avatar-name{color:var(--primary)}
.avatar-name{font-weight:500}

/* ===== Range slider ===== */
input[type=range]{appearance:none;width:100%;height:6px;background:var(--surface-2);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}

/* ===== Explainer ===== */
.exp-section{padding:2rem 0;border-bottom:1px solid var(--border)}
.exp-section:last-child{border-bottom:none}
.exp-h{font-size:1.6rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.01em}
.exp-h .num{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:.5rem;background:var(--primary-soft);color:var(--primary);font-size:1rem;margin-right:.5rem;vertical-align:middle}
.exp-p{color:var(--text-dim);line-height:1.55;margin-bottom:1rem}
.exp-p code{background:var(--surface-2);padding:.1rem .35rem;border-radius:.25rem;font-size:.85em;color:var(--text)}
.exp-widget{background:var(--surface);border:1px solid var(--border);border-radius:.75rem;padding:1.25rem;margin:1.25rem 0}
.exp-widget canvas{display:block;width:100%;height:auto;background:#0d1426;border-radius:.5rem}
.exp-readout{display:flex;justify-content:center;gap:1.5rem;margin-top:.75rem;font-size:.9rem;flex-wrap:wrap}
.exp-readout > div{text-align:center}
.exp-readout .v{font-size:1.25rem;font-weight:700;font-family:ui-monospace,monospace}
.exp-readout .l{font-size:.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em}
.exp-compare{border-collapse:collapse;width:100%;margin-top:1rem;font-size:.92rem}
.exp-compare th,.exp-compare td{padding:.75rem;text-align:left;border-bottom:1px solid var(--border)}
.exp-compare th{background:var(--surface-2);color:var(--text-mute);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.exp-compare .yes{color:var(--primary)} .exp-compare .no{color:var(--danger)}

/* ===== Polla standings ===== */
.streak-dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:2px}
.streak-w{background:var(--primary)} .streak-l{background:var(--danger)}

/* ===== File upload ===== */
.upload-zone{border:2px dashed var(--border-strong);border-radius:.75rem;padding:2rem;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--primary);background:rgba(16,185,129,.04)}

/* ===== Misc ===== */
.kbd{font-family:ui-monospace,monospace;font-size:.85em;background:var(--surface-2);border:1px solid var(--border);padding:.05rem .35rem;border-radius:.25rem;color:var(--text-dim)}
.spinner{display:inline-block;width:1rem;height:1rem;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Pref toggles (theme/lang) ===== */
.pref-toggle{padding:.35rem .55rem;border-radius:.4rem;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:.8rem;line-height:1;transition:all .15s;cursor:pointer}
.pref-toggle:hover{color:var(--text);border-color:var(--border-strong)}
.pref-toggle .icon{font-size:1rem}

/* ===== Live match · pantalla en vivo (como la app vieja) ===== */
.live-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
.live-back{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.6rem;background:var(--surface);border:1px solid var(--border);font-size:1.1rem;cursor:pointer;color:var(--text)}
.live-back:hover{background:var(--surface-2)}
.live-title{font-size:1.8rem;font-weight:800;letter-spacing:-.01em}
.team-tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem 1.1rem 1.1rem;cursor:pointer;transition:transform .15s,border-color .15s}
.team-tile:hover{transform:translateY(-1px)}
.team-tile.A{background:linear-gradient(180deg, rgba(59,130,246,.10), transparent 80%);border-color:rgba(59,130,246,.25)}
.team-tile.B{background:linear-gradient(180deg, rgba(239,68,68,.10), transparent 80%);border-color:rgba(239,68,68,.25)}
.team-tile.A.active{border-color:rgba(59,130,246,.7);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.team-tile.B.active{border-color:rgba(239,68,68,.7);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.team-tile .pill{display:inline-block;padding:.2rem .6rem;border-radius:1rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}
.team-tile.A .pill{background:rgba(59,130,246,.15);color:var(--teamA)}
.team-tile.B .pill{background:rgba(239,68,68,.15);color:var(--teamB)}
.team-tile .team-name{font-size:1.05rem;font-weight:600;line-height:1.2}
.team-tile .team-score{font-size:3.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-top:.5rem}
.team-tile .bar{position:absolute;left:1.1rem;right:1.1rem;bottom:.6rem;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
:root[data-theme="light"] .team-tile .bar{background:rgba(0,0,0,.06)}
.team-tile .bar > span{display:block;height:100%;background:var(--teamA);transition:width .3s}
.team-tile.B .bar > span{background:var(--teamB)}

.meta-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.1rem;background:var(--surface);border:1px solid var(--border);border-radius:.85rem;margin-bottom:1rem}
.meta-label{font-size:.78rem;color:var(--text-mute);font-weight:500}
.meta-value{font-size:1.05rem;font-weight:700;margin-top:.1rem}

.live-card{background:var(--surface);border:1px solid var(--border);border-radius:.85rem;padding:1.1rem 1.1rem 1.2rem}
.who-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.team-picker{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:.6rem;padding:.25rem;gap:.25rem}
.team-pick{flex:1;padding:.55rem 1rem;border-radius:.45rem;font-size:.95rem;font-weight:500;color:var(--text-dim);cursor:pointer;text-align:center;border:none;background:transparent}
.team-pick.A.active{background:rgba(59,130,246,.18);color:var(--teamA);box-shadow:inset 0 0 0 1px rgba(59,130,246,.45)}
.team-pick.B.active{background:rgba(239,68,68,.15);color:var(--teamB);box-shadow:inset 0 0 0 1px rgba(239,68,68,.45)}
.points-display{margin:1rem 0;height:3.6rem;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:.75rem;display:flex;align-items:center;justify-content:flex-end;padding:0 1.1rem;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.points-display.empty{color:var(--text-mute);font-weight:400;justify-content:flex-end}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.numkey{padding:.95rem 0;background:var(--surface-2);border:1px solid var(--border);border-radius:.65rem;font-size:1.5rem;font-weight:600;cursor:pointer;color:var(--text);transition:transform .05s,background .15s}
.numkey:hover{background:var(--surface-3)}
.numkey:active{transform:scale(.97)}
.numkey.danger{color:var(--danger)}
.live-actions{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
.live-actions > *{flex:1;min-width:7rem}
.rounds-list{margin-top:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:.75rem;overflow:hidden}
.rounds-list .head{padding:.7rem 1rem;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:600}
.round-row{display:flex;justify-content:space-between;align-items:center;padding:.55rem 1rem;border-top:1px solid rgba(255,255,255,.04);font-size:.9rem}
:root[data-theme="light"] .round-row{border-top-color:rgba(0,0,0,.04)}
.round-row .team-A-text{color:var(--teamA);font-weight:500}
.round-row .team-B-text{color:var(--teamB);font-weight:500}
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="#/" class="brand" onclick="event.preventDefault();go('/')">
      <span class="brand-icon">DR</span>
      <span>DomiRank</span>
    </a>
    <nav id="nav"></nav>
  </div>
</header>

<main id="app"></main>

<footer>
  DomiRank preview · OpenSkill (Plackett-Luce / Weng-Lin) · datos mock locales ·
  <a class="link" onclick="resetAll()">resetear datos</a>
</footer>

<script type="module">
import { rating, rate as osRate, ordinal as osOrdinal, predictWin } from 'https://esm.sh/openskill@4';
window.os = { rating, rate: osRate, ordinal: osOrdinal, predictWin };
window.dispatchEvent(new Event('os-ready'));
</script>

<script>
/* ============================================================
   MODALIDADES, SETS, PAÍSES
   ============================================================ */
const SETS = {
  'd6': { code:'d6', label:'6-6', tilesPerPlayer:7, totalTiles:28 },
  'd9': { code:'d9', label:'9-9', tilesPerPlayer:10, totalTiles:55 },
};
const MODALIDADES = {
  ven:    { code:'ven', name:'Venezolano',     flag:'🇻🇪', country:'VE', set:'d6', target:100, capicua:30, format:'doubles', desc:'Doble-seis · 100 pts · capicúa +30 · 2v2' },
  dom:    { code:'dom', name:'Dominicano',     flag:'🇩🇴', country:'DO', set:'d6', target:200, capicua:30, format:'doubles', desc:'Doble-seis · 200 pts · capicúa +30 · 2v2' },
  cub:    { code:'cub', name:'Cubano',         flag:'🇨🇺', country:'CU', set:'d9', target:150, capicua:30, format:'doubles', desc:'Doble-nueve · 150 pts · capicúa +30 · 2v2' },
  pri:    { code:'pri', name:'Puertorriqueño', flag:'🇵🇷', country:'PR', set:'d6', target:200, capicua:50, format:'doubles', desc:'Doble-seis · 200 pts · capicúa +50 · 2v2' },
  custom: { code:'custom', name:'Personalizado', flag:'⚙️', country:null, set:'d6', target:100, capicua:30, format:'doubles', desc:'Ajusta los parámetros manualmente' },
};
const COUNTRIES = [
  { code:'VE', name:'Venezuela',         flag:'🇻🇪', suggested:'ven' },
  { code:'DO', name:'Rep. Dominicana',   flag:'🇩🇴', suggested:'dom' },
  { code:'CU', name:'Cuba',              flag:'🇨🇺', suggested:'cub' },
  { code:'PR', name:'Puerto Rico',       flag:'🇵🇷', suggested:'pri' },
  { code:'CO', name:'Colombia',          flag:'🇨🇴', suggested:'ven' },
  { code:'MX', name:'México',            flag:'🇲🇽', suggested:'dom' },
  { code:'PA', name:'Panamá',            flag:'🇵🇦', suggested:'ven' },
  { code:'ES', name:'España',            flag:'🇪🇸', suggested:'dom' },
  { code:'US', name:'Estados Unidos',    flag:'🇺🇸', suggested:'dom' },
  { code:'AR', name:'Argentina',         flag:'🇦🇷', suggested:'custom' },
  { code:'CL', name:'Chile',             flag:'🇨🇱', suggested:'custom' },
  { code:'PE', name:'Perú',              flag:'🇵🇪', suggested:'custom' },
  { code:'OT', name:'Otro',              flag:'🌎', suggested:'custom' },
];
function modalityByCode(c) { return MODALIDADES[c] || MODALIDADES.custom; }
function countryByCode(c) { return COUNTRIES.find(x => x.code === c); }
function bucketKey(set, format) { return `${set}_${format === 'singles' ? 's' : 'd'}`; }

/* ============================================================
   I18N (es neutro / en)
   ============================================================ */

const ord = (mu, sigma) => mu - 3*sigma;

/* DomiRank Global: combinación Bayesiana inverse-variance de los 4 buckets.
   Buckets: d6_s (singles 6-6), d6_d (doubles 6-6), d9_s (singles 9-9), d9_d (doubles 9-9).
   Cada uno es una estimación parcial de la habilidad latente del jugador.
   Se combinan con la fórmula clásica de fusión de gaussianas independientes:
     μ_g = Σ μ_i · p_i / Σ p_i      donde p_i = 1/σ²_i (precisión)
     σ²_g = 1 / Σ p_i
   La σ alta default de buckets no-jugados los hace contribuir muy poco. */
const GLOBAL_MIN_GAMES = 5;
const BUCKETS = ['d6_s','d6_d','d9_s','d9_d'];
function getBucket(p, key) { return p[key] || {mu:25, sigma:25/3, g:0, w:0, l:0}; }
function totalGames(p) { return BUCKETS.reduce((s,k) => s + getBucket(p,k).g, 0); }

function globalRating(p) {
  let muNumerator = 0, precSum = 0;
  for (const k of BUCKETS) {
    const b = getBucket(p, k);
    const prec = 1 / (b.sigma * b.sigma);
    muNumerator += b.mu * prec;
    precSum += prec;
  }
  const mu = muNumerator / precSum;
  const sigma = Math.sqrt(1 / precSum);
  const games = totalGames(p);
  return { mu, sigma, ordinal: mu - 3*sigma, games, qualified: games >= GLOBAL_MIN_GAMES };
}

function hashStr(s) { let h = 0; for (let i=0;i<s.length;i++) h = ((h<<5)-h) + s.charCodeAt(i)|0; return h; }
function avatarColor(username) {
  const colors = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#06b6d4'];
  return colors[Math.abs(hashStr(username)) % colors.length];
}
function initials(name) {
  return name.split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
}
function avatarHtml(player, size = 36) {
  const s = `${size}px`;
  const fs = `${Math.round(size*0.4)}px`;
  if (player?.avatarUrl) {
    return `<div class="avatar" style="width:${s};height:${s}"><img src="${player.avatarUrl}" alt=""></div>`;
  }
  return `<div class="avatar" style="width:${s};height:${s};background:${avatarColor(player?.username||'')};font-size:${fs}">${initials(player?.name||'?')}</div>`;
}
function avatarLink(player, size = 36, opts = {}) {
  return `<a class="avatar-link" href="#" onclick="event.preventDefault();go('/profile/${player.username}')">
    ${avatarHtml(player, size)}
    ${opts.hideName?'':`<span class="avatar-name">${player.name}</span>`}
    ${opts.username?`<span class="text-mute" style="font-size:.85rem">@${player.username}</span>`:''}
  </a>`;
}

function deltaTag(delta) {
  const cls = delta >= 0 ? 'delta-up' : 'delta-down';
  const sign = delta >= 0 ? '+' : '';
  return `<span class="mono ${cls}">${sign}${delta.toFixed(2)} μ</span>`;
}

function daysSince(iso) { return (Date.now() - new Date(iso).getTime()) / 86400000; }

/* ============================================================
   ROUTER
   ============================================================ */
window.go = function(path){ location.hash = '#' + path; };
window.addEventListener('hashchange', render);
function currentPath() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, queryStr] = h.split('?');
  return { path, query: new URLSearchParams(queryStr||'') };
}

/* ============================================================
   VIEW: LEADERBOARD
   ============================================================ */
function bucketLabel(key) {
  const [set, fmt] = key.split('_');
  return (fmt === 's' ? t('leaderboard.tab.singles') : t('leaderboard.tab.doubles')) + ' ' + SETS[set].label;
}

function viewLeaderboard() {
  const { query } = currentPath();
  const tabRaw = query.get('tab') || 'global';
  const tab = (tabRaw === 'global' || BUCKETS.includes(tabRaw)) ? tabRaw : 'global';

  let rows;
  if (tab === 'global') {
    rows = state.players
      .map(p => ({ p, gr: globalRating(p) }))
      .filter(x => x.gr.qualified)
      .sort((a,b) => b.gr.ordinal - a.gr.ordinal);
  } else {
    rows = [...state.players]
      .filter(p => getBucket(p,tab).g > 0)
      .sort((a,b) => ord(getBucket(b,tab).mu, getBucket(b,tab).sigma) - ord(getBucket(a,tab).mu, getBucket(a,tab).sigma))
      .map(p => ({ p, key: tab }));
  }

  const tabBtn = (key, label) => `<span class="tab ${tab===key?'active':''}" onclick="go('/leaderboard?tab=${key}')">${label}</span>`;

  return `
    <div class="row" style="margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem">
      <h1 class="section-title" style="margin:0">${t('leaderboard.title')}</h1>
      <div class="tabs" style="flex-wrap:wrap">
        ${tabBtn('global', t('leaderboard.tab.global'))}
        ${tabBtn('d6_s', t('leaderboard.tab.singles')+' 6-6')}
        ${tabBtn('d6_d', t('leaderboard.tab.doubles')+' 6-6')}
        ${tabBtn('d9_s', t('leaderboard.tab.singles')+' 9-9')}
        ${tabBtn('d9_d', t('leaderboard.tab.doubles')+' 9-9')}
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr>
          <th style="width:3rem">#</th><th>Jugador</th>
          <th class="text-right">Rating</th>
          <th class="text-right">μ</th><th class="text-right">σ</th>
          <th class="text-right">Partidas</th>
          ${tab==='global' ? '<th class="text-right">S / P</th>' : '<th class="text-right">G-P</th>'}
        </tr></thead>
        <tbody>
        ${rows.length === 0 ? `<tr><td colspan="7" class="empty">${tab==='global'?`Aún nadie tiene ${GLOBAL_MIN_GAMES}+ partidas para entrar al ranking global.`:`Sin jugadores con partidas en ${bucketLabel(tab)} todavía.`}</td></tr>`
          : rows.map((row,i) => {
              const p = row.p;
              const isGlobal = tab === 'global';
              const b = isGlobal ? null : getBucket(p, row.key);
              const rating = isGlobal ? row.gr.ordinal : ord(b.mu, b.sigma);
              const mu     = isGlobal ? row.gr.mu      : b.mu;
              const sigma  = isGlobal ? row.gr.sigma   : b.sigma;
              const games  = isGlobal ? row.gr.games   : b.g;
              const country = p.country ? countryByCode(p.country) : null;
              return `
              <tr>
                <td class="text-mute">${i+1}</td>
                <td>
                  <div class="avatar-link" style="cursor:pointer" onclick="go('/profile/${p.username}')">
                    ${avatarHtml(p,32)}
                    <div>
                      <div class="avatar-name" style="color:var(--text)">${country?country.flag+' ':''}${p.name}</div>
                      <div class="text-mute" style="font-size:.8rem">@${p.username}</div>
                    </div>
                  </div>
                </td>
                <td class="text-right mono text-primary" style="font-weight:700">${rating.toFixed(1)}</td>
                <td class="text-right mono text-dim" style="font-size:.85rem">${mu.toFixed(2)}</td>
                <td class="text-right mono text-dim" style="font-size:.85rem">${sigma.toFixed(2)}</td>
                <td class="text-right">${games}</td>
                ${isGlobal
                  ? `<td class="text-right text-dim" style="font-size:.85rem">${BUCKETS.map(k => getBucket(p,k).g).filter(g=>g>0).length} formatos</td>`
                  : `<td class="text-right" style="font-size:.9rem"><span class="text-primary">${b.w}</span>-<span class="text-danger">${b.l}</span></td>`}
              </tr>
            `}).join('')}
        </tbody>
      </table>
    </div>
    <p class="muted-help" style="margin-top:1rem">
      ${tab==='global'
        ? `DomiRank Global combina tus dos ratings ponderando por <strong>certeza</strong> (1/σ²). Cuanto más juegas un formato, más pesa en el global. Mínimo ${GLOBAL_MIN_GAMES} partidas totales.`
        : `Rating = μ − 3σ (OpenSkill ordinal). μ es el skill estimado, σ la incertidumbre.`}
    </p>
  `;
}

function viewDashboard() {

  const range = parseInt(query.get('range') || '15');

function ratingBreakdown(p) {
  const cards = BUCKETS.filter(k => getBucket(p,k).g > 0).map(k => ratingCard(bucketLabel(k), getBucket(p,k))).join('');
  if (!cards) {
    return `<div class="card text-mute" style="text-align:center;padding:1.5rem;margin-bottom:1.25rem">Aún no tienes partidas. <a class="link" onclick="go('/matches/new')">Inicia la primera.</a></div>`;
  }
  return `<div class="grid-2" style="margin-bottom:1.25rem">${cards}</div>`;
}

function domiRankCard(p) {
  const gr = globalRating(p);
  return `
    <div class="card" style="margin-bottom:1.25rem;background:linear-gradient(135deg, rgba(16,185,129,.08), rgba(59,130,246,.05));border-color:rgba(16,185,129,.2)">
      <div class="row" style="align-items:flex-start;flex-wrap:wrap;gap:1rem">
        <div>
          <div class="text-mute" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.06em">${t('dashboard.domirank')}</div>
          <div style="display:flex;align-items:baseline;gap:.6rem;margin-top:.25rem">
            <span class="mono" style="font-size:3.5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
              ${gr.qualified ? gr.ordinal.toFixed(1) : '—'}
            </span>
            ${gr.qualified
              ? `<span class="text-mute" style="font-size:.85rem">${t('dashboard.rating')} · μ ${gr.mu.toFixed(2)} · σ ${gr.sigma.toFixed(2)}</span>`
              : `<span class="text-mute" style="font-size:.85rem">${t('dashboard.pendingQualify', {n: GLOBAL_MIN_GAMES - gr.games})}</span>`}
          </div>
          <div class="text-dim" style="font-size:.85rem;margin-top:.5rem">
            ${t('dashboard.totalGames', {n: gr.games})} ·
            <a class="link" onclick="go('/como-funciona')">${t('dashboard.seeMath')}</a>
          </div>
        </div>
      </div>
    </div>
  `;
}

function ratingCard(title, r) {
  return `
    <div class="card">
      <div class="text-mute" style="font-size:.85rem">${title}</div>
      <div class="rating-row">
        <span class="rating-big mono">${r.g > 0 ? ord(r.mu,r.sigma).toFixed(1) : '—'}</span>
        <span class="text-mute" style="font-size:.9rem">rating</span>
      </div>
      <div class="kpi">
        <div><div class="kpi-label">μ</div><div class="mono">${r.mu.toFixed(2)}</div></div>
        <div><div class="kpi-label">σ</div><div class="mono">${r.sigma.toFixed(2)}</div></div>
        <div><div class="kpi-label">Partidas</div><div class="mono">${r.g}</div></div>
      </div>
      <div style="margin-top:.75rem;font-size:.9rem" class="text-dim">
        <span class="text-primary">${r.w} G</span> · <span class="text-danger">${r.l} P</span>
        ${r.g>0?`· ${((r.w/r.g)*100).toFixed(0)}% victorias`:''}
      </div>
    </div>
  `;
}

function historySection(userId, range, basePath) {
  const all = state.matches
    .map(m => ({m, mp: m.teams.flatMap(t => t.players).find(pp => pp.user_id === userId), team: m.teams.find(t => t.players.some(pp=>pp.user_id===userId))}))
    .filter(x => x.mp)
    .sort((a,b) => new Date(b.m.date) - new Date(a.m.date));
  const filtered = range >= 9999 ? all : all.filter(({m}) => daysSince(m.date) <= range);

  // Summary stats
  const wins = filtered.filter(x => x.mp.rank === 1).length;
  const losses = filtered.length - wins;
  const netDelta = filtered.reduce((s,x) => s + (x.mp.mu_after - x.mp.mu_before), 0);
  const rangeLabel = range >= 9999 ? 'Todo' : `${range} días`;

  const tab = (n, label) => `<span class="tab ${range===n?'active':''}" onclick="go('${basePath}?range=${n}')">${label}</span>`;

  return `
    <div class="card">
      <div class="row" style="margin-bottom:1rem;flex-wrap:wrap">
        <h2 style="font-size:1.25rem;font-weight:600">Historial</h2>
        <div class="tabs">
          ${tab(15,'15 días')}
          ${tab(30,'30 días')}
          ${tab(90,'90 días')}
          ${tab(99999,'Todo')}
        </div>
      </div>
      <div class="grid-3" style="margin-bottom:1rem">
        <div class="card card-tight" style="background:var(--surface-2)">
          <div class="kpi-label">Partidas (${rangeLabel})</div>
          <div class="mono" style="font-size:1.5rem;font-weight:700;margin-top:.25rem">${filtered.length}</div>
        </div>
        <div class="card card-tight" style="background:var(--surface-2)">
          <div class="kpi-label">G - P</div>
          <div class="mono" style="font-size:1.5rem;font-weight:700;margin-top:.25rem">
            <span class="text-primary">${wins}</span> - <span class="text-danger">${losses}</span>
            <span class="text-dim" style="font-size:.85rem;margin-left:.5rem">${filtered.length?((wins/filtered.length)*100).toFixed(0)+'%':'—'}</span>
          </div>
        </div>
        <div class="card card-tight" style="background:var(--surface-2)">
          <div class="kpi-label">Δ Rating neto</div>
          <div class="mono ${netDelta>=0?'delta-up':'delta-down'}" style="font-size:1.5rem;font-weight:700;margin-top:.25rem">
            ${netDelta>=0?'+':''}${netDelta.toFixed(2)} μ
          </div>
        </div>
      </div>
      ${filtered.length === 0
        ? `<p class="text-mute" style="text-align:center;padding:1.5rem 0">No hay partidas en los últimos ${rangeLabel.toLowerCase()}.</p>`
        : filtered.slice(0,20).map(({m,mp}) => {
            const won = mp.rank === 1;
            const delta = mp.mu_after - mp.mu_before;
            const tour = m.tournament_id ? tournamentById(m.tournament_id) : null;
            return `
              <div class="row" style="padding:.7rem 0;border-bottom:1px solid var(--border)">
                <div>
                  <a class="link" onclick="go('/matches/${m.id}')" style="color:var(--text);font-weight:500">
                    ${m.format==='singles'?'Singles':'Parejas'} a ${m.target_points} pts
                  </a>
                  ${tour?` <span class="badge badge-info" style="margin-left:.4rem">${tour.name}</span>`:''}
                  <div class="text-mute" style="font-size:.75rem;margin-top:.15rem">${fmtDate(m.date)}</div>
                </div>
                <div style="display:flex;gap:.75rem;align-items:center;font-size:.9rem">
                  <span class="badge ${won?'badge-win':'badge-loss'}">${won?'Ganó':'Perdió'}</span>
                  ${deltaTag(delta)}
                </div>
              </div>
            `;
          }).join('')}
    </div>
  `;
}

        ${m.format==='singles'?'Singles':'Parejas'} · a ${m.target_points} pts · ${fmtDate(m.date)}

      </div>
      <h1 class="section-title" style="margin-top:.25rem">Partida</h1>
    </div>
    <div class="grid-2">
      ${m.teams.map(t => {
        const won = t.players[0].rank === 1;
        return `
          <div class="team-card ${won?'winner':''}">
            <div class="row" style="margin-bottom:.5rem">
              <h2 style="font-weight:600">Equipo ${t.team}</h2>
              ${won?'<span class="badge badge-win">Ganador</span>':''}
            </div>
            <div class="score-display mono" style="margin-bottom:1rem">${t.score}</div>
            ${t.players.map(pp => {
              const player = playerById(pp.user_id);
              const delta = pp.mu_after - pp.mu_before;
              return `
                <div class="row" style="font-size:.9rem;padding:.5rem 0;border-top:1px solid var(--border)">
                  <div class="avatar-link" style="cursor:pointer" onclick="go('/profile/${player.username}')">
                    ${avatarHtml(player,28)}
                    <span style="color:var(--text)">${player.name}</span>
                  </div>
                  <div class="mono" style="display:flex;gap:.4rem;align-items:center">
                    <span class="text-mute">${pp.mu_before.toFixed(2)}</span>
                    <span class="text-mute">→</span>
                    <span>${pp.mu_after.toFixed(2)}</span>
                    <span class="${delta>=0?'delta-up':'delta-down'}">(${delta>=0?'+':''}${delta.toFixed(2)})</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

window.handleAvatarUpload = (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('Imagen muy grande (máx 2MB)'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    me().avatarUrl = ev.target.result;
    saveState(); render();
  };
  reader.readAsDataURL(file);
};
window.removeAvatar = () => { me().avatarUrl = null; saveState(); render(); };
window.saveSettings = () => {
  const name = document.getElementById('setName').value.trim();
  if (name) me().name = name;
  saveState();
  go('/dashboard');
};

/* ============================================================
   VIEW: ONBOARDING (país + modalidad default)
   ============================================================ */
function viewOnboarding() {
  if (!state.me) { go('/login'); return ''; }
  const p = me();
  const step = window._ob?.step || 1;
  const country = window._ob?.country || p.country || null;
  const modality = window._ob?.modality || p.defaultModality || (country ? COUNTRIES.find(c=>c.code===country)?.suggested : null);
  window._ob = { step, country, modality };

  if (step === 1) {
    return `
      <div style="max-width:36rem;margin:2rem auto" class="stack">
        <div style="text-align:center">
          <div style="display:inline-grid;place-items:center;width:4rem;height:4rem;border-radius:1rem;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;font-weight:800;font-size:1.5rem;margin-bottom:1rem">DR</div>
          <h1 class="section-title" style="margin-bottom:.5rem">¡Bienvenido a DomiRank!</h1>
          <p class="text-dim">Antes de empezar, cuéntanos un poco sobre cómo juegas. Esto nos ayuda a poner tus partidas en la modalidad correcta por defecto.</p>
        </div>
        <div class="card">
          <label class="label" style="font-size:1rem;margin-bottom:.85rem">¿De qué país eres?</label>
          <div class="grid-2" style="gap:.5rem">
            ${COUNTRIES.map(c => `
              <label style="display:flex;align-items:center;gap:.6rem;padding:.7rem;background:${country===c.code?'var(--primary-soft)':'var(--surface-2)'};border:1px solid ${country===c.code?'rgba(16,185,129,.4)':'var(--border)'};border-radius:.5rem;cursor:pointer">
                <input type="radio" name="country" value="${c.code}" ${country===c.code?'checked':''} onchange="setOnboardingCountry('${c.code}')">
                <span style="font-size:1.25rem">${c.flag}</span>
                <span>${c.name}</span>
              </label>
            `).join('')}
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="onboardingStep2()" ${country?'':'disabled'}>Continuar →</button>
      </div>
    `;
  }
  // Step 2: modalidad
  const c = countryByCode(country);
  return `
    <div style="max-width:36rem;margin:2rem auto" class="stack">
      <div style="text-align:center">
        <div style="font-size:3rem;margin-bottom:.5rem">${c?.flag||'🌎'}</div>
        <h1 class="section-title" style="margin-bottom:.5rem">¿Qué modalidad juegas?</h1>
        <p class="text-dim">Te sugerimos la más común para ${c?.name||'tu país'}, pero puedes elegir cualquiera. Después puedes cambiar al crear cada partida.</p>
      </div>
      <div class="card stack" style="gap:.5rem">
        ${Object.values(MODALIDADES).map(m => {
          const suggested = c && c.suggested === m.code;
          return `
            <label style="display:flex;gap:.75rem;align-items:flex-start;padding:.85rem;background:${modality===m.code?'var(--primary-soft)':'var(--surface-2)'};border:1px solid ${modality===m.code?'rgba(16,185,129,.4)':'var(--border)'};border-radius:.5rem;cursor:pointer">
              <input type="radio" name="modality" value="${m.code}" ${modality===m.code?'checked':''} onchange="setOnboardingModality('${m.code}')" style="margin-top:.2rem">
              <div style="flex:1">
                <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
                  <span style="font-weight:600">${m.flag} ${m.name}</span>
                  ${suggested?'<span class="badge badge-win">Sugerido para tu país</span>':''}
                </div>
                <div class="text-mute" style="font-size:.8rem;margin-top:.15rem">${m.desc}</div>
              </div>
            </label>
          `;
        }).join('')}
      </div>
      <div style="display:flex;gap:.6rem">
        <button class="btn btn-ghost" onclick="onboardingBack()">← Atrás</button>
        <button class="btn btn-primary" style="flex:1" onclick="finishOnboarding()" ${modality?'':'disabled'}>Empezar a jugar</button>
      </div>
    </div>
  `;
}
window.setOnboardingCountry = (c) => {
  window._ob.country = c;
  // Auto-sugerir modalidad
  const suggested = COUNTRIES.find(x=>x.code===c)?.suggested;
  if (suggested) window._ob.modality = suggested;
  render();
};
window.setOnboardingModality = (m) => { window._ob.modality = m; render(); };
window.onboardingStep2 = () => { window._ob.step = 2; render(); };
window.onboardingBack = () => { window._ob.step = 1; render(); };
window.finishOnboarding = () => {
  const u = me();
  u.country = window._ob.country;
  u.defaultModality = window._ob.modality;
  u.onboarded = true;
  window._ob = null;
  saveState();
  go('/dashboard');
};

   VIEW: NUEVA PARTIDA

function viewNewMatch() {
  if (!state.me) { go('/login'); return ''; }

  // Inicializa con la modalidad default del usuario
  const userDefault = me()?.defaultModality || 'ven';
  const initial = MODALIDADES[userDefault];
  const nm = window._nm || {
    modality: userDefault,
    format: initial.format,
    set: initial.set,
    target: initial.target,
    capicua: initial.capicua,
    teamA: [state.me, ''],
    teamB: ['', ''],
  };
  window._nm = nm;
  const size = nm.format === 'singles' ? 1 : 2;

  function playerSelect(team, idx) {
    const value = (team==='A'?nm.teamA:nm.teamB)[idx] || '';
    return `
      <label class="label">${t('match.new.player', {n: idx+1})}</label>
      <select class="input" onchange="setNMSlot('${team}',${idx},this.value)">

        <h1 class="section-title" style="margin-bottom:.25rem">${t('match.new.title')}</h1>

      </div>

      <div class="card">
        <label class="label" style="margin-bottom:.5rem">Modalidad</label>

              <input type="radio" name="modality" value="${m.code}" ${nm.modality===m.code?'checked':''} onchange="setNMModality('${m.code}')" style="margin-top:.15rem">
              <div style="flex:1">
                <div style="font-weight:600">${m.flag} ${m.name}${m.code===userDefault?` <span class="badge badge-info" style="margin-left:.25rem;font-size:.65rem">tu default</span>`:''}</div>
                <div class="text-mute" style="font-size:.75rem;margin-top:.1rem">${m.desc}</div>
              </div>

          `).join('')}

      </div>

      <div class="card">
        <div class="grid-2">
          <div>
            <label class="label">${t('match.new.format')}</label>
            <div class="tabs full">
              <span class="tab ${nm.format==='singles'?'active':''}" onclick="setNMFormat('singles')">${t('match.new.singles')}</span>
              <span class="tab ${nm.format==='doubles'?'active':''}" onclick="setNMFormat('doubles')">${t('match.new.doubles')}</span>

          </div>
          <div>
            <label class="label">Set de fichas</label>

              <span class="tab ${nm.set==='d6'?'active':''}" onclick="${isCustom?`setNMField('set','d6')`:''}" style="${isCustom?'':'opacity:.6;cursor:not-allowed'}">6-6 · 28 fichas</span>
              <span class="tab ${nm.set==='d9'?'active':''}" onclick="${isCustom?`setNMField('set','d9')`:''}" style="${isCustom?'':'opacity:.6;cursor:not-allowed'}">9-9 · 55 fichas</span>
            </div>
          </div>
          <div>
            <label class="label">Puntos meta</label>
            <input class="input" type="number" min="50" max="500" step="10" value="${nm.target}" onchange="setNMField('target', parseInt(this.value)||100)" ${isCustom?'':'readonly style="opacity:.7"'}>
          </div>
          <div>
            <label class="label">Capicúa bonus</label>
            <input class="input" type="number" min="0" max="100" step="5" value="${nm.capicua}" onchange="setNMField('capicua', parseInt(this.value)||0)" ${isCustom?'':'readonly style="opacity:.7"'}>
          </div>
        </div>
        ${!isCustom ? `<p class="text-mute" style="font-size:.75rem;margin-top:.5rem">Set, puntos y capicúa vienen del preset. Para editarlos elige "Personalizado".</p>` : ''}

        <div class="card">
          <h3 class="team-A" style="font-weight:600;margin-bottom:.75rem">${t('match.new.teamA')}</h3>

        </div>
        <div class="card">
          <h3 class="team-B" style="font-weight:600;margin-bottom:.75rem">${t('match.new.teamB')}</h3>
          ${Array.from({length:size}).map((_,i) => `<div style="margin-bottom:.6rem">${playerSelect('B',i)}</div>`).join('')}
        </div>
      </div>
      <div id="nm-error" style="display:none" class="banner error"></div>
      <button class="btn btn-primary" style="width:100%" onclick="startLiveMatch()">${t('match.new.start')}</button>
    </div>
  `;

window.setNMModality = (code) => {
  const m = MODALIDADES[code];
  window._nm.modality = code;
  if (code !== 'custom') {
    window._nm.set = m.set;
    window._nm.target = m.target;
    window._nm.capicua = m.capicua;
    window._nm.format = m.format;
    const size = m.format === 'singles' ? 1 : 2;
    window._nm.teamA = window._nm.teamA.slice(0,size); while(window._nm.teamA.length < size) window._nm.teamA.push('');
    window._nm.teamB = window._nm.teamB.slice(0,size); while(window._nm.teamB.length < size) window._nm.teamB.push('');
  }
  render();
};
window.setNMField = (field, value) => { window._nm[field] = value; render(); };
window.setNMFormat = (f) => {
  window._nm.format = f;
  const size = f === 'singles' ? 1 : 2;
  window._nm.teamA = window._nm.teamA.slice(0,size); while(window._nm.teamA.length < size) window._nm.teamA.push('');
  window._nm.teamB = window._nm.teamB.slice(0,size); while(window._nm.teamB.length < size) window._nm.teamB.push('');
  render();
};
window.setNMSlot = (team, idx, val) => {
  if (team === 'A') window._nm.teamA[idx] = val; else window._nm.teamB[idx] = val;
};

window.startLiveMatch = () => {
  const errEl = document.getElementById('nm-error');
  const showErr = msg => { errEl.style.display='block'; errEl.textContent=msg; };
  errEl.style.display='none';
  const nm = window._nm;
  const size = nm.format === 'singles' ? 1 : 2;
  const a = nm.teamA.slice(0,size).filter(Boolean);
  const b = nm.teamB.slice(0,size).filter(Boolean);
  if (a.length !== size || b.length !== size) return showErr(`Selecciona ${size} jugador(es) por equipo.`);
  const ids = [...a, ...b];
  if (new Set(ids).size !== ids.length) return showErr('Un jugador no puede estar en dos equipos.');

  state.liveMatch = {
    format: nm.format, set: nm.set, modality: nm.modality,
    target_points: nm.target, capicua_bonus: nm.capicua,
    teamA: a, teamB: b,
    scoreA: 0, scoreB: 0, rounds: [],
    startedAt: new Date().toISOString(), tournamentId: null,
    activeTeam: 'A', currentInput: 0,
  };
  window._nm = null;
  saveState();
  go('/matches/live');
};

/* ============================================================
   VIEW: PARTIDA EN VIVO (estilo app vieja con numpad)
   ============================================================ */
function teamNames(live) {
  const A = live.teamA.map(id => playerById(id)?.name.split(' ')[0]||'?').join(' & ');
  const B = live.teamB.map(id => playerById(id)?.name.split(' ')[0]||'?').join(' & ');
  return { A, B };
}

function viewLiveMatch() {
  if (!state.me) { go('/login'); return ''; }
  const live = state.liveMatch;
  if (!live) { go('/matches/new'); return ''; }
  const { A: nameA, B: nameB } = teamNames(live);
  const isSingles = live.format === 'singles';

  const pillB = isSingles ? t('match.live.teamBPill').replace('A','B') : t('match.live.teamBPill');
  const pillBFinal = isSingles ? t('match.live.teamBSingle') : t('match.live.teamBPill');
  const pctA = Math.min(100, (live.scoreA / live.target_points) * 100);
  const pctB = Math.min(100, (live.scoreB / live.target_points) * 100);
  const finished = live.scoreA >= live.target_points || live.scoreB >= live.target_points;
  const winnerName = live.scoreA >= live.target_points ? nameA : nameB;

  const isToday = startTime.toDateString() === new Date().toDateString();
  const dateLabel = isToday
    ? `${t('match.live.today')} · ${startTime.toLocaleTimeString(lang==='en'?'en':'es',{hour:'2-digit',minute:'2-digit'})}`

          <div class="team-name">${nameB}</div>
          <div class="team-score">${live.scoreB}</div>
          <div class="bar"><span style="width:${pctB}%"></span></div>
        </div>
      </div>

      <div class="meta-row">
        <div>
          <div class="meta-label">${t('match.live.meta')}</div>
          <div class="meta-value">${t('match.live.metaPoints', {n: live.target_points})}</div>
        </div>
        <div style="text-align:right">
          <div class="meta-label">${finished ? t('common.finish').toUpperCase() : t('match.live.status')}</div>
          <div class="meta-value">${dateLabel}</div>
        </div>
      </div>

      ${finished ? `
        <div class="banner" style="background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:var(--primary)">
          ${t('match.live.winnerReached', {team: winnerName})}
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="finalizeLiveMatch()">${t('common.finish')} · ${t('dashboard.rating')}</button>
      ` : `
        <div class="live-card">
          <div class="who-row">
            <div style="font-size:1.05rem;font-weight:700">${t('match.live.registerPoints')}</div>
            <div class="text-mute" style="font-size:.85rem">${t('match.live.whoSums')}</div>
          </div>
          <div class="team-picker">
            <button class="team-pick A ${live.activeTeam==='A'?'active':''}" onclick="setLiveTeam('A')">${nameA}</button>
            <button class="team-pick B ${live.activeTeam==='B'?'active':''}" onclick="setLiveTeam('B')">${nameB}</button>
          </div>
          <div class="points-display ${lcd===0?'empty':''}">${lcd===0?t('match.live.enterPoints'):lcd}</div>
          <div class="numpad">
            <button class="numkey" onclick="numInput(7)">7</button>
            <button class="numkey" onclick="numInput(8)">8</button>
            <button class="numkey" onclick="numInput(9)">9</button>
            <button class="numkey" onclick="numInput(4)">4</button>
            <button class="numkey" onclick="numInput(5)">5</button>
            <button class="numkey" onclick="numInput(6)">6</button>
            <button class="numkey" onclick="numInput(1)">1</button>
            <button class="numkey" onclick="numInput(2)">2</button>
            <button class="numkey" onclick="numInput(3)">3</button>
            <button class="numkey danger" onclick="numClear()">C</button>
            <button class="numkey" onclick="numInput(0)">0</button>
            <button class="numkey" onclick="numBackspace()">⌫</button>
          </div>
          <div class="live-actions">
            <button class="btn btn-ghost" onclick="undoLastRound()" ${live.rounds.length===0?'disabled':''}>${t('match.live.undoLast')}</button>
            <button class="btn btn-ghost" style="background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:var(--warning)" onclick="capicuaBonus()">¡Capicúa! +${live.capicua_bonus}</button>

window.addLiveRound = () => {
  const live = state.liveMatch;
  if (!live || live.currentInput <= 0) return;
  const team = live.activeTeam === 'A' ? 1 : 2;
  live.rounds.push({ team, points: live.currentInput, at: new Date().toISOString() });
  if (team === 1) live.scoreA += live.currentInput; else live.scoreB += live.currentInput;
  live.currentInput = 0;

};

window.undoLastRound = () => {

  if (!live || live.rounds.length === 0) return;
  const r = live.rounds.pop();
  if (r.team === 1) live.scoreA -= r.points; else live.scoreB -= r.points;

window.capicuaBonus = () => {

  const pts = live.capicua_bonus;
  live.rounds.push({ team, points: pts, at: new Date().toISOString(), kind: 'capicua' });

  const mid = recordMatch({

/* Core: record a match, update OpenSkill if rated.
   El bucket de rating se determina por (set, format): d6_s, d6_d, d9_s, d9_d. */
function recordMatch({ format, set='d6', modality='ven', target, capicua_bonus=30, teamA, teamB, scoreA, scoreB, tournamentId, rated=true }) {
  const key = bucketKey(set, format);
  const ratingsA = teamA.map(id => { const p = playerById(id); const b = getBucket(p,key); return window.os.rating({ mu:b.mu, sigma:b.sigma }); });
  const ratingsB = teamB.map(id => { const p = playerById(id); const b = getBucket(p,key); return window.os.rating({ mu:b.mu, sigma:b.sigma }); });
  const ranks = scoreA > scoreB ? [1,2] : [2,1];
  let newA = ratingsA, newB = ratingsB;
  if (rated) {
    [newA, newB] = window.os.rate([ratingsA, ratingsB], { rank: ranks });
  }
  const matchId = 'm' + Date.now() + Math.random().toString(36).slice(2,6);
  const newMatch = {
    id: matchId, format, set, modality, target_points: target, capicua_bonus,
    date: new Date().toISOString(), tournament_id: tournamentId,
    teams: [
      { team:1, score: scoreA, players: teamA.map((id,i) => ({
          user_id: id, mu_before: ratingsA[i].mu, sigma_before: ratingsA[i].sigma,
          mu_after: newA[i].mu, sigma_after: newA[i].sigma, rank: ranks[0]
      }))},
      { team:2, score: scoreB, players: teamB.map((id,i) => ({
          user_id: id, mu_before: ratingsB[i].mu, sigma_before: ratingsB[i].sigma,
          mu_after: newB[i].mu, sigma_after: newB[i].sigma, rank: ranks[1]
      }))},
    ]
  };
  state.matches.unshift(newMatch);
  if (rated) {
    teamA.forEach((id,i) => {
      const p = playerById(id);
      if (!p[key]) p[key] = D();
      p[key].mu = newA[i].mu; p[key].sigma = newA[i].sigma; p[key].g += 1;
      if (ranks[0] === 1) p[key].w += 1; else p[key].l += 1;
    });
    teamB.forEach((id,i) => {
      const p = playerById(id);
      if (!p[key]) p[key] = D();
      p[key].mu = newB[i].mu; p[key].sigma = newB[i].sigma; p[key].g += 1;
      if (ranks[1] === 1) p[key].w += 1; else p[key].l += 1;
    });
  }
  saveState();
  return matchId;
}

function computeStandings(t, games) {
  const stats = {};
  for (const pid of t.playerIds) {
    stats[pid] = { player: playerById(pid), wins:0, losses:0, games:0, pf:0, pa:0, streak:[] };
  }
  // Process oldest → newest for racha order
  const ordered = [...games].sort((a,b) => new Date(a.date) - new Date(b.date));
  for (const m of ordered) {
    for (const team of m.teams) {
      for (const pp of team.players) {
        if (!stats[pp.user_id]) continue;
        const s = stats[pp.user_id];
        s.games++;
        const won = pp.rank === 1;
        if (won) s.wins++; else s.losses++;
        const myScore = team.score;
        const opponentScore = m.teams.find(t => t !== team).score;
        s.pf += myScore; s.pa += opponentScore;
        s.streak.push(won);
        if (s.streak.length > 5) s.streak.shift();
      }
    }
  }
  // Solo jugadores con al menos 1 partida o todos? Mostramos todos los inscritos.
  return Object.values(stats).sort((a,b) => {
    if (b.pf !== a.pf) return b.pf - a.pf;
    if (b.wins !== a.wins) return b.wins - a.wins;
    const wpa = a.games?a.wins/a.games:0, wpb = b.games?b.wins/b.games:0;
    if (wpb !== wpa) return wpb - wpa;
    return (b.pf-b.pa) - (a.pf-a.pa);
  });
}

}
window.setTPSlot = (label, idx, val) => {
  const arr = label==='A'?window._tp.teamA:window._tp.teamB;
  arr[idx] = val;
};
window.setTPScore = (label, val) => {
  if (label === 'A') window._tp.scoreA = val; else window._tp.scoreB = val;
};
window.submitTournamentMatch = (tournamentId) => {
  const tp = window._tp;
  const t = tournamentById(tournamentId);
  const errEl = document.getElementById('tp-error');
  const showErr = m => { errEl.style.display='block'; errEl.textContent=m; };
  errEl.style.display='none';
  if (!osReady) return showErr('Motor de rating aún cargando, intenta de nuevo en un segundo.');
  if (tp.teamA.some(x=>!x) || tp.teamB.some(x=>!x)) return showErr('Faltan jugadores en algún equipo.');
  if (tp.scoreA === tp.scoreB) return showErr('Empates no se admiten.');
  const ids = [...tp.teamA, ...tp.teamB];
  if (new Set(ids).size !== 4) return showErr('No puedes repetir jugadores.');
  const tMod = MODALIDADES[t.modality] || MODALIDADES.dom;
  const mid = recordMatch({
    format:'doubles', set: tMod.set, modality: t.modality || 'dom',
    target:t.pointsToWin, capicua_bonus: tMod.capicua,
    teamA:tp.teamA, teamB:tp.teamB, scoreA:tp.scoreA, scoreB:tp.scoreB,
    tournamentId, rated:t.rated,
  });
  window._tp = null;
  go('/tournaments/'+tournamentId);
};

/* ============================================================
   EXPLAINER WIDGETS
   ============================================================ */
function pdf(x, mu, sigma) {
  const a = 1 / (sigma * Math.sqrt(2*Math.PI));
  return a * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}

function drawDistributions(canvas, dists, opts = {}) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.width;
  const h = 220;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  const xMin = 0, xMax = 50;
  const peak = Math.max(...dists.map(d => pdf(d.mu, d.mu, d.sigma)));

  // X axis
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h-20); ctx.lineTo(w, h-20); ctx.stroke();
  ctx.fillStyle = 'rgba(167,176,200,.6)'; ctx.font = '11px ui-monospace,monospace';
  for (let v = 0; v <= 50; v += 10) {
    const px = (v - xMin) / (xMax - xMin) * w;
    ctx.fillText(v, px + 2, h - 6);
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h-20); ctx.stroke();
  }

  for (const d of dists) {
    // Shading
    if (d.shade) {
      ctx.fillStyle = d.shadeColor || (d.color + '33');
      ctx.beginPath();
      for (let px = 0; px <= w; px++) {
        const x = xMin + (xMax - xMin) * px / w;
        const y = pdf(x, d.mu, d.sigma);
        const py = (h-20) - (y / peak) * (h - 40);
        if (px === 0) ctx.moveTo(px, h-20);
        ctx.lineTo(px, py);
      }
      ctx.lineTo(w, h-20); ctx.closePath(); ctx.fill();
    }
    // Curve
    ctx.beginPath();
    for (let px = 0; px <= w; px++) {
      const x = xMin + (xMax - xMin) * px / w;
      const y = pdf(x, d.mu, d.sigma);
      const py = (h-20) - (y / peak) * (h - 40);
      if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = d.color; ctx.lineWidth = 2.5; ctx.stroke();

    // Vertical line at mu
    const muPx = (d.mu - xMin) / (xMax - xMin) * w;
    ctx.strokeStyle = d.color + 'aa';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(muPx, h-20); ctx.lineTo(muPx, 10); ctx.stroke();
    ctx.setLineDash([]);

    // Mu label
    ctx.fillStyle = d.color; ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.fillText((d.label||'μ') + '=' + d.mu.toFixed(2), muPx + 5, 22);

    // ordinal line (mu - 3sigma)
    if (d.showOrdinal) {
      const ord = d.mu - 3*d.sigma;
      const ordPx = (ord - xMin) / (xMax - xMin) * w;
      ctx.strokeStyle = 'rgba(245,158,11,.7)';
      ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(ordPx, h-20); ctx.lineTo(ordPx, 30); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(245,158,11,1)'; ctx.font = '11px ui-monospace,monospace';
      ctx.fillText('μ−3σ = ' + ord.toFixed(1), ordPx + 4, 45);
    }
  }
}

/* --- widget 1: distribution sliders --- */
window.drawDist = () => {
  const mu = parseFloat(document.getElementById('mu1').value);
  const sigma = parseFloat(document.getElementById('sig1').value);
  document.getElementById('mu1Val').textContent = mu.toFixed(2);
  document.getElementById('sig1Val').textContent = sigma.toFixed(2);
  document.getElementById('r-mu').textContent = mu.toFixed(2);
  document.getElementById('r-sig').textContent = sigma.toFixed(2);
  document.getElementById('r-ord').textContent = (mu-3*sigma).toFixed(2);
  document.getElementById('r-at-least').textContent = (mu-3*sigma).toFixed(1);
  const canvas = document.getElementById('dist1');
  drawDistributions(canvas, [{ mu, sigma, color:'#10b981', label:'μ', shade:true, showOrdinal:true }]);
};

/* --- widget 3: simulation Alice vs Bob --- */
const SIM_START = { aMu:25, aSigma:25/3, bMu:25, bSigma:25/3, history:[] };
let SIM = structuredClone(SIM_START);

function drawSim() {
  const canvas = document.getElementById('dist2');
  if (!canvas) return;
  drawDistributions(canvas, [
    { mu:SIM.aMu, sigma:SIM.aSigma, color:'#3b82f6', label:'Alice' },
    { mu:SIM.bMu, sigma:SIM.bSigma, color:'#ef4444', label:'Bob' },
  ]);
  const readout = document.getElementById('sim-readout');
  if (readout) {
    readout.innerHTML = `
      <div><div class="l">Alice μ</div><div class="v" style="color:#3b82f6">${SIM.aMu.toFixed(2)}</div></div>
      <div><div class="l">Alice σ</div><div class="v" style="color:#3b82f6">${SIM.aSigma.toFixed(2)}</div></div>
      <div><div class="l">Bob μ</div><div class="v" style="color:#ef4444">${SIM.bMu.toFixed(2)}</div></div>
      <div><div class="l">Bob σ</div><div class="v" style="color:#ef4444">${SIM.bSigma.toFixed(2)}</div></div>
      <div><div class="l">Partidas</div><div class="v">${SIM.history.length}</div></div>
    `;
  }
}
window.simWin = (who) => {
  if (!osReady) return;
  const a = window.os.rating({ mu: SIM.aMu, sigma: SIM.aSigma });
  const b = window.os.rating({ mu: SIM.bMu, sigma: SIM.bSigma });
  const ranks = who === 'A' ? [1,2] : [2,1];
  const [na, nb] = window.os.rate([[a],[b]], { rank: ranks });
  SIM.aMu = na[0].mu; SIM.aSigma = na[0].sigma;
  SIM.bMu = nb[0].mu; SIM.bSigma = nb[0].sigma;
  SIM.history.push(who);
  drawSim();
};
window.simReset = () => { SIM = structuredClone(SIM_START); drawSim(); };

  const bMu = parseFloat(document.getElementById('pbMu').value);
  document.getElementById('paMuV').textContent = aMu.toFixed(1);
  document.getElementById('pbMuV').textContent = bMu.toFixed(1);
  if (!osReady) return;
  const a = window.os.rating({ mu: aMu, sigma: 3 });
  const b = window.os.rating({ mu: bMu, sigma: 3 });
  const [pA, pB] = window.os.predictWin([[a],[b]]);
  document.getElementById('predict-A').style.width = (pA*100) + '%';
  document.getElementById('predict-B').style.width = (pB*100) + '%';
  document.getElementById('predict-A').textContent = (pA*100).toFixed(1) + '%';
  document.getElementById('predict-B').textContent = (pB*100).toFixed(1) + '%';
};

/* --- widget 5: convergence --- */
function drawConvergence(history) {
  const canvas = document.getElementById('conv');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.width, h = 220;
  canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  // axes
  const padL = 36, padR = 14, padT = 14, padB = 28;
  const cw = w - padL - padR, ch = h - padT - padB;
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h-padB); ctx.lineTo(w-padR, h-padB); ctx.stroke();

  const points = [{mu:25, sigma:25/3}, ...history];
  const N = points.length;
  if (N < 2) {
    ctx.fillStyle = 'rgba(167,176,200,.6)';
    ctx.font = '12px Inter,sans-serif';
    ctx.fillText('Pulsa "Simular" para ver evolución de μ y σ', padL + 10, h/2);
    return;
  }
  const muMax = 55, muMin = 20;
  const sigMax = 9, sigMin = 0;

  // mu line
  ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = padL + (i/(N-1)) * cw;
    const py = padT + (1 - (p.mu - muMin)/(muMax-muMin)) * ch;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();

  // sigma line
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = padL + (i/(N-1)) * cw;
    const py = padT + (1 - (p.sigma - sigMin)/(sigMax-sigMin)) * ch;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();

  // labels
  ctx.fillStyle = 'rgba(167,176,200,.6)'; ctx.font = '11px ui-monospace,monospace';
  ctx.fillText('partidas →', w/2 - 25, h-8);
  ctx.fillStyle = '#10b981'; ctx.fillText('μ', 6, padT + 14);
  ctx.fillStyle = '#3b82f6'; ctx.fillText('σ', 6, h-padB-4);
}
let convAnim = null;
window.runConvergence = () => {
  if (!osReady) return;
  if (convAnim) clearInterval(convAnim);
  let mu = 25, sigma = 25/3;
  const history = [];
  let i = 0;
  convAnim = setInterval(() => {
    if (i >= 30) { clearInterval(convAnim); convAnim = null; return; }
    const a = window.os.rating({ mu, sigma });
    const b = window.os.rating({ mu: 25, sigma: 25/3 });
    const [na] = window.os.rate([[a],[b]], { rank: [1,2] });
    mu = na[0].mu; sigma = na[0].sigma;
    history.push({ mu, sigma });
    drawConvergence(history);
    i++;
  }, 90);
};
window.resetConvergence = () => {
  if (convAnim) { clearInterval(convAnim); convAnim = null; }
  drawConvergence([]);
};

/* --- widget 7: DomiRank Global calculator --- */
window.updateGlobal = () => {
  const muS = parseFloat(document.getElementById('gMuS').value);
  const sigS = parseFloat(document.getElementById('gSigS').value);
  const muD = parseFloat(document.getElementById('gMuD').value);
  const sigD = parseFloat(document.getElementById('gSigD').value);
  document.getElementById('gMuSV').textContent = muS.toFixed(1);
  document.getElementById('gSigSV').textContent = sigS.toFixed(1);
  document.getElementById('gMuDV').textContent = muD.toFixed(1);
  document.getElementById('gSigDV').textContent = sigD.toFixed(1);
  const pS = 1/(sigS*sigS), pD = 1/(sigD*sigD), pT = pS + pD;
  const mu = (muS*pS + muD*pD) / pT;
  const sigma = Math.sqrt(1/pT);
  const ordinal = mu - 3*sigma;
  document.getElementById('globalMu').textContent = mu.toFixed(2);
  document.getElementById('globalSig').textContent = sigma.toFixed(2);
  document.getElementById('globalOrdinal').textContent = ordinal.toFixed(1);
  const wS = pS/pT*100, wD = pD/pT*100;
  const dominant = wS > wD ? 'Singles' : 'Parejas';
  document.getElementById('globalExplain').textContent =
    `Peso: Singles ${wS.toFixed(0)}% · Parejas ${wD.toFixed(0)}% — ${dominant} domina porque tiene σ menor (más certeza).`;
};

function render() {
  renderNav();
  const { path, query } = currentPath();
  let html = '';
  if (path === '/' || path === '') html = viewHome();
  else if (path.startsWith('/leaderboard')) html = viewLeaderboard();
  else if (path === '/dashboard') html = viewDashboard();
  else if (path === '/login') html = viewLogin();
  else if (path === '/onboarding') html = viewOnboarding();
  else if (path === '/settings') html = viewSettings();
  else if (path === '/como-funciona') html = viewExplainer();
  else if (path === '/matches/new') html = viewNewMatch();
  else if (path === '/matches/live') html = viewLiveMatch();
  else if (path.startsWith('/matches/')) html = viewMatch(path.split('/')[2]);
  else if (path.startsWith('/profile/')) html = viewProfile(path.split('/')[2]);
  else if (path === '/tournaments') html = viewTournaments();
  else if (path === '/tournaments/new') html = viewTournamentNew();
  else if (path.match(/^\/tournaments\/[^/]+\/play$/)) html = viewTournamentPlay(path.split('/')[2]);
  else if (path.startsWith('/tournaments/')) html = viewTournament(path.split('/')[2]);
  else html = `<div class="empty">404 · <a class="link" onclick="go('/')">volver al inicio</a></div>`;
  $('#app').innerHTML = `<div class="fade-in">${html}</div>`;

  // Init widgets after DOM is in
  setTimeout(() => {
    if (path === '/como-funciona') {
      if (document.getElementById('dist1')) drawDist();
      if (document.getElementById('dist2')) drawSim();
      if (document.getElementById('predict-A')) updatePredict();
      if (document.getElementById('conv')) drawConvergence([]);
      if (document.getElementById('gMuS')) updateGlobal();
    }
  }, 10);

  window.scrollTo(0, 0);
}

};

render();
