name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default least-privilege: workflow only reads the repo. Individual jobs can
# request more if/when needed (e.g. `pull-requests: write` for a label step).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, build]
    defaults:
      run:
        working-directory: domino-app
    steps:
      # Actions pinned to commit SHAs (supply-chain: tag repointing protection).
      # Update the SHAs alongside the version-comment when bumping.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: domino-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.task == 'build' && 'https://placeholder.supabase.co' || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.task == 'build' && 'placeholder-anon-key' || '' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
